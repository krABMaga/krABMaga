name: Cargo builds
'on':
  pull_request:
    branches:
      - main
env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  stdbuild:
    runs-on: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        rust:
          - stable
    name: '${{ matrix.os }} ${{ matrix.rust }} build'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            persist-credentials: false
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/workflows/install-deps
        with:
          profile: visualization
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: '${{ matrix.rust }}'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build
        run: cargo build --release
      - name: BuildVisualization
        run: 'cargo build --release --features "visualization, visualization_wasm"'
      - name: BuildBayesian
        run: cargo build --release --features bayesian
      - name: Test
        run: cargo test --features parallel
      - name: TestNoFeatures
        run: cargo test
  mpibuild:
    runs-on: '${{ matrix.os }}'
    continue-on-error: true
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
            mpi: mpich
          - os: macos-15-intel
            rust: stable
            mpi: openmpi
          - os: windows-2022
            rust: stable
            mpi: msmpi
    name: '${{ matrix.os }} MPI'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup MPI
        uses: mpi4py/setup-mpi@3417e34f1394a16723d7913c236642c24e95fd5a # v1.4.4
        with:
          mpi: '${{ matrix.mpi }}'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: '${{ matrix.rust }}'
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/workflows/install-deps
        with:
          profile: mpi
      - name: Install macOS dependencies
        if: matrix.os == 'macos-15-intel'
        run: |
          brew install libffi pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix libffi)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "LIBFFI_DIR=$(brew --prefix libffi)" >> $GITHUB_ENV

      - name: Build with MPI
        run: cargo build --release --features distributed_mpi
  nightlybuild:
    runs-on: ubuntu-latest
    continue-on-error: true
    name: 'ubuntu nightly build'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        uses: ./.github/workflows/install-deps
        with:
          profile: base
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build nightly
        run: cargo build --release
