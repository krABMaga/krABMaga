name: Install System Dependencies

inputs:
  profile:
    description: 'Dependency profile to install (base, visualization, mpi)'
    required: false
    default: 'base'

runs:
  using: 'composite'
  steps:
    - name: Install base dependencies
      if: inputs.profile == 'base'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libfontconfig1-dev

    - name: Install visualization dependencies
      if: inputs.profile == 'visualization'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config \
          libx11-dev \
          libasound2-dev \
          libudev-dev \
          libgtk-3-dev \
          libwayland-dev \
          libxkbcommon-dev \
          libxcb-randr0-dev \
          libxcb-xtest0-dev \
          libxcb-xinerama0-dev \
          libxcb-shape0-dev \
          libxcb-xkb-dev \
          libxcb-render0-dev \
          libxcb-xfixes0-dev \
          libxcb1-dev \
          portaudio19-dev \
          build-essential \
          libpulse-dev \
          libdbus-1-dev \
          libfontconfig1-dev

    - name: Install MPI dependencies
      if: inputs.profile == 'mpi'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          libfontconfig1-dev

    - name: Validate dependency profile
      if: inputs.profile != 'base' && inputs.profile != 'visualization' && inputs.profile != 'mpi'
      shell: bash
      run: |
        echo "Unsupported install-deps profile: '${{ inputs.profile }}'"
        exit 1
